[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movingknots"
version = "0.0.0"
description = "Python/JAX implementation of moving knots surface regression"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["movingknots*"]
